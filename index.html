    <meta charset="utf-8">
    <link rel="stylesheet" href="pannellum.css">

    <style>
        html, body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
        }

        #panorama{
            width:100%;
            height:100vh;
}

.pnlm-container{
    background: url("loadingpages.png") no-repeat !important;
    background-size: cover !important;
}

.pnlm-load-box.loading-text{

    position: fixed !important;

    top: 50% !important;
    left: 50% !important;

    transform: translate(-50%, -50%) !important;

    width: 650px !important;
    min-height: 180px !important;

    padding: 25px 30px !important;

    box-sizing: border-box;

    background: rgba(0,0,0,.45) !important;

    border: none !important;

    border-radius: 18px !important;

    display: flex !important;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}

.pnlm-load-box p{

    color:white !important;

    font-size:22px !important;

    line-height:2 !important;

    text-align:center;

    max-width:100%;

    margin:auto;

    font-family:tahoma;

}

.pnlm-lbar{
    background: rgba(255,255,255,.25) !important;
}

.pnlm-lbar-fill{
    background: white !important;
}

      #logo{

    position:fixed;

    top:20px;

    right:20px;

    width:90px;

    height:auto;

    z-index:9999;

    pointer-events:none;

    opacity:0.95;

}

viewer.on("scenechange", function(sceneId){

    setTimeout(function(){

        const box = document.querySelector(".pnlm-load-box");
        const p = document.querySelector(".pnlm-load-box p");

        if(box){
            box.classList.add("loading-text");
        }

        if(p && sceneTexts[sceneId]){
            p.innerHTML = sceneTexts[sceneId];
        }

    },10);

});

const loadButtonWatcher = setInterval(function () {

    const btn = document.querySelector(".pnlm-load-button");

    if (btn) {

        btn.addEventListener("click", function () {

            const waitForBox = setInterval(function () {

                const box = document.querySelector(".pnlm-load-box");
                const p = document.querySelector(".pnlm-load-box p");

                if (box && p) {

                    box.classList.add("loading-text");
                    p.innerHTML = sceneTexts["room1"];

                    clearInterval(waitForBox);
                }

            }, 10);

        }, { once: true });

        clearInterval(loadButtonWatcher);
    }

}, 10);

viewer.on("load", function(){

    setTimeout(function(){

        const box = document.querySelector(".pnlm-load-box");

        if(box){
            box.classList.remove("loading-text");
        }

    },100);

});
