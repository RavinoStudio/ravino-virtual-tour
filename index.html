            height:100%;

        }

        #panorama{

        }

        .pnlm-container{
            background: url("loadingpages.png") no-repeat !important;

        }

        .pnlm-load-box.loading-text{

            width:750px;

            min-height:260px;
            height:auto;
            padding:30px 40px;
            background:rgba(0,0,0,.45);
            border-radius:18px;
            box-sizing:border-box;
        }

        .pnlm-load-box p{
            color:white !important;
            font-size:22px !important;
            line-height:2.2 !important;
            text-align:center;
            margin:0 0 25px 0 !important;
            font-family:tahoma;
            white-space:normal;
            word-break:break-word;
            overflow-wrap:anywhere;
        }

        .pnlm-lbar{
            width:180px;
            margin:25px auto 0 auto !important;
        }

        .pnlm-lbar-fill{
            background:white !important;
        }

        #logo{
            position:fixed;
            top:20px;
            right:20px;
            width:90px;
            height:auto;
            z-index:9999;
            pointer-events:none;
            opacity:0.95;
        }


        /* ================================================== */
        /* 1. آیکون اطلاعات روی مانیتور                      */
        /* ================================================== */

        .info-hotspot {
            height:36px;
            width:36px;
            border-radius:50%;
            background:rgba(0,162,232,0.9);
            border:2px solid #ffffff;
            color:white;
            font-weight:bold;
            font-size:20px;
            font-family:Arial,sans-serif;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            box-shadow:0 0 15px rgba(0,162,232,0.8);
            transition:transform 0.2s ease, background 0.2s ease;
        }

        .info-hotspot:hover {
            transform:scale(1.15);
            background:rgba(0,162,232,1);
        }


        /* ================================================== */
        /* 2. Modal اطلاعات مانیتور                          */
        /* ================================================== */

        .modal-overlay {
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            z-index:10000;

            display:flex;
            justify-content:center;
            align-items:center;

            opacity:0;
            pointer-events:none;

            transition:opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity:1;
            pointer-events:auto;
        }

        .modal-card {
            width:400px;
            max-width:85vw;
            max-height:85vh;

            background:#181818;
            color:#ffffff;

            border-radius:14px;

            box-shadow:0 20px 40px rgba(0,0,0,0.6);

            position:relative;

            display:flex;
            flex-direction:column;

            overflow:hidden;

            font-family:tahoma,sans-serif;

            border:1px solid rgba(255,255,255,0.12);
        }

        .modal-close {
            position:absolute;
            top:10px;
            right:10px;

            width:32px;
            height:32px;

            background:rgba(0,0,0,0.7);
            color:white;

            border-radius:50%;

            display:flex;
            align-items:center;
            justify-content:center;

            cursor:pointer;

            font-size:18px;

            z-index:10;

            transition:background 0.2s;
        }

        .modal-close:hover {
            background:rgba(255,0,0,0.8);
        }

        .modal-image-container {
            width:100%;
            height:240px;

            background:#000000;

            display:flex;
            align-items:center;
            justify-content:center;

            overflow:hidden;

            cursor:pointer;

            position:relative;
        }

        .modal-image-container::after {
            content:"🔍 مشاهده مانیتورها";

            position:absolute;

            bottom:8px;

            background:rgba(0,162,232,0.85);
            color:#fff;

            font-size:11px;

            padding:3px 8px;

            border-radius:12px;

            pointer-events:none;

            transition:opacity 0.2s;
        }

        .modal-image-container:hover::after {
            background:rgba(0,162,232,1);
        }

        .modal-image-container img {
            width:100%;
            height:100%;

            object-fit:contain;

            padding:10px;

            box-sizing:border-box;

            transition:transform 0.2s ease;
        }

        .modal-image-container:hover img {
            transform:scale(1.03);
        }

        .modal-content {
            padding:20px;

            overflow-y:auto;

            direction:rtl;

            text-align:right;
        }

        .modal-title {
            font-size:18px;
            font-weight:bold;

            margin-bottom:10px;

            color:#4db8ff;
        }

        .modal-description {
            font-size:14px;

            line-height:1.8;

            color:#dddddd;
        }


        /* ================================================== */
        /* 3. نمایش مانیتورها                                */
        /* ================================================== */

        .monitor-viewer {
            position:fixed;

            top:0;
            left:0;

            width:100vw;
            height:100vh;

            background:#000000;

            z-index:20000;

            display:flex;

            justify-content:center;
            align-items:center;

            opacity:0;

            pointer-events:none;

            transition:opacity 0.3s ease;

            overflow:hidden;

            touch-action:pan-y;

            user-select:none;

            -webkit-user-select:none;
        }

        .monitor-viewer.active {
            opacity:1;

            pointer-events:auto;
        }

        .monitor-wrapper {
            position:relative;

            width:100%;
            height:100%;

            display:flex;

            justify-content:center;
            align-items:center;

            overflow:hidden;
        }

#monitorImage {
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
    -webkit-user-select:none;

    cursor:grab;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}

        #monitorImage.dragging {
            cursor:grabbing;

            transition:none;
        }


        /* ================================================== */
        /* 4. دکمه بستن مانیتورها                            */
        /* ================================================== */

        .monitor-close {
            position:absolute;

            top:20px;
            right:25px;

            width:42px;
            height:42px;

            background:rgba(255,0,0,0.75);

            color:white;

            border-radius:50%;

            display:flex;

            align-items:center;
            justify-content:center;

            cursor:pointer;

            font-size:24px;

            font-weight:bold;

            z-index:30005;

            box-shadow:0 0 10px rgba(0,0,0,0.5);

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .monitor-close:hover {
            background:rgba(255,0,0,1);

            transform:scale(1.1);
        }


        /* ================================================== */
        /* 5. شماره مانیتور                                  */
        /* ================================================== */

        .monitor-counter {
            position:absolute;

            bottom:25px;
            left:50%;

            transform:translateX(-50%);

            background:rgba(20,20,20,0.8);

            color:white;

            padding:8px 18px;

            border-radius:20px;

            font-family:tahoma,sans-serif;

            font-size:14px;

            z-index:30005;

            border:1px solid rgba(255,255,255,0.2);

            backdrop-filter:blur(6px);

            pointer-events:none;
        }



        /* ================================================== */
        /* 7. دسکتاپ قدیمی - دیگر استفاده نمی‌شود             */
        /* ================================================== */

        .fullscreen-overlay {
            position:fixed;

            top:0;
            left:0;

            width:100vw;
            height:100vh;

            background:#000000;

            z-index:20000;

            display:flex;

            justify-content:center;
            align-items:center;

            opacity:0;

            pointer-events:none;

            transition:opacity 0.3s ease;
        }

        .fullscreen-overlay.active {
            opacity:1;

            pointer-events:auto;
        }


        /* ================================================== */
        /* 8. اکسل قدیمی - نگه داشته شده                      */
        /* ================================================== */

        #excelView {
            z-index:30000;
        }

        .excel-wrapper {
            position:relative;

            width:100vw;
            height:100vh;

            display:flex;

            justify-content:center;
            align-items:center;
        }

        .excel-wrapper img {
            width:100vw;
            height:100vh;

            object-fit:contain;
        }

        .excel-nav-bar {
            position:absolute;

            bottom:25px;
            left:50%;

            transform:translateX(-50%);

            display:flex;

            gap:12px;

            background:rgba(20,20,20,0.85);

            padding:8px 18px;

            border-radius:25px;

            border:1px solid rgba(255,255,255,0.2);

            z-index:30002;

            box-shadow:0 8px 20px rgba(0,0,0,0.6);

        }

        .excel-nav-btn {
            background:rgba(255,255,255,0.1);

            color:#ffffff;

            border:1px solid rgba(255,255,255,0.25);

            padding:6px 14px;

            border-radius:16px;

            font-family:tahoma,sans-serif;

            font-size:13px;

            cursor:pointer;

            transition:all 0.2s ease;

            display:flex;

            align-items:center;

            gap:6px;
        }

            border-color:#107c41;

            transform:translateY(-2px);
        }

            font-weight:bold;

                height:40px;

                font-size:22px;

                opacity:0.4;
            }

            .monitor-arrow-left {
                left:10px;
            }

            .monitor-arrow-right {
                right:10px;
            }

function createInfoHotspot(hotSpotDiv, args) {

    hotSpotDiv.classList.add('info-hotspot');

    hotSpotDiv.innerHTML = '!';

    hotSpotDiv.addEventListener('click', function() {

        openModal(
            args.image,
            args.title,
            args.desc
        );

    });

}

/* ========================================================= */
/* باز کردن نمایشگر مانیتورها                                */
/* ========================================================= */

document

        closeModal();

        openMonitorViewer();

/* ========================================================= */
/* متغیرهای Monitor Viewer                                    */
/* ========================================================= */

const monitorViewer =
    document.getElementById('monitorViewer');

const monitorImage =
    document.getElementById('monitorImage');

const monitorCounter =
    document.getElementById('monitorCounter');


/*
 * ترتیب مانیتورها
 *
 * بسیار مهم:
 * ترتیب آرایه دقیقاً همان ترتیب نمایش است.
 */

const monitorImages = [

    'monitor1.png',
    'monitor2.png',
    'monitor3.png',
    'monitor4.png',
    'monitor5.png',
    'monitor6.png'

];


/*
 * شماره مانیتور فعلی
 *
 * 0 = monitor1
 * 1 = monitor2
 * ...
 * 5 = monitor6
 */

let currentMonitorIndex = 0;


/* ========================================================= */
/* باز کردن Monitor Viewer                                   */
/* ========================================================= */

function openMonitorViewer() {

    currentMonitorIndex = 0;

    updateMonitorImage();

    monitorViewer.classList.add('active');

}


/* ========================================================= */
/* بستن Monitor Viewer                                       */
/* ========================================================= */

function closeMonitorViewer() {

    monitorViewer.classList.remove('active');

}


document
    .getElementById('closeMonitorViewer')
    .addEventListener(
        'click',
        closeMonitorViewer
    );


/* ========================================================= */
/* تغییر تصویر مانیتور                                       */
/* ========================================================= */

function updateMonitorImage() {

    const imageName =
        monitorImages[currentMonitorIndex];


    /*
     * شروع افکت خروج تصویر فعلی
     *
     * تصویر کمی کوچک و محو می‌شود.
     */

    monitorImage.style.opacity = '0';
    monitorImage.style.transform = 'scale(0.96)';


    setTimeout(function() {

        monitorImage.src = imageName;


        monitorImage.onload = function() {

            /*
             * تصویر جدید با Fade + Zoom
             * وارد صفحه می‌شود.
             */

            monitorImage.style.opacity = '1';
            monitorImage.style.transform = 'scale(1)';

        };

    }, 180);


    const persianNumber =
        convertToPersianNumber(
            currentMonitorIndex + 1
        );


    monitorCounter.innerText =
        'مانیتور ' +
        persianNumber +
        ' از ۶';

}

/* ========================================================= */
/* تبدیل عدد انگلیسی به فارسی                                */
/* ========================================================= */

function convertToPersianNumber(number) {

    const numbers = [
        '۰',
        '۱',
        '۲',
        '۳',
        '۴',
        '۵',
        '۶',
        '۷',
        '۸',
        '۹'
    ];

    return number
        .toString()
        .split('')
        .map(function(char) {

            return numbers[parseInt(char)];

        })
        .join('');

}


/* ========================================================= */
/* مانیتور بعدی                                              */
/* ========================================================= */

function nextMonitor() {

    if (
        currentMonitorIndex >=
        monitorImages.length - 1
    ) {

        return;

    }

    currentMonitorIndex++;

    updateMonitorImage();

}


/* ========================================================= */
/* مانیتور قبلی                                              */
/* ========================================================= */

function previousMonitor() {

    if (currentMonitorIndex <= 0) {

        return;

    }

    currentMonitorIndex--;

    updateMonitorImage();

}


/* ========================================================= */
/* Mouse Drag + Touch Swipe                                  */
/* ========================================================= */

let startX = 0;
let startY = 0;

let currentX = 0;
let currentY = 0;

let isDragging = false;

let hasMoved = false;


/*
 * حداقل مقدار حرکتی که برای Swipe لازم است.
 *
 * اگر مثلاً کاربر فقط 5px حرکت کند،
 * آن را Swipe حساب نمی‌کنیم.
 */

const swipeThreshold = 70;


/* ========================================================= */
/* شروع Touch                                               */
/* ========================================================= */

monitorViewer.addEventListener(
    'touchstart',
    function(e) {

        if (!monitorViewer.classList.contains('active')) {

            return;

        }

        if (!e.touches || e.touches.length === 0) {

            return;

        }

        const touch = e.touches[0];

        startX = touch.clientX;

        startY = touch.clientY;

        currentX = startX;

        currentY = startY;

        isDragging = true;

        hasMoved = false;

    },
    {
        passive:true
    }
);


/* ========================================================= */
/* حرکت Touch                                               */
/* ========================================================= */

monitorViewer.addEventListener(
    'touchmove',
    function(e) {

        if (!isDragging) {

            return;

        }

        if (!e.touches || e.touches.length === 0) {

            return;

        }

        const touch = e.touches[0];

        currentX = touch.clientX;

        currentY = touch.clientY;

        const diffX =
            currentX - startX;

        const diffY =
            currentY - startY;


        /*
         * اگر حرکت افقی بیشتر از عمودی باشد،
         * یعنی کاربر احتمالاً Swipe افقی انجام داده.
         */

        if (
            Math.abs(diffX) >
            Math.abs(diffY)
        ) {

            if (
                Math.abs(diffX) >
                10
            ) {

                hasMoved = true;

            }

        }

    },
    {
        passive:true
    }
);


/* ========================================================= */
/* پایان Touch                                               */
/* ========================================================= */

monitorViewer.addEventListener(
    'touchend',
    function() {

        if (!isDragging) {

            return;

        }

        isDragging = false;


        const diffX =
            currentX - startX;

        const diffY =
            currentY - startY;


        /*
         * فقط Swipe افقی را بررسی می‌کنیم.
         */

        if (
            Math.abs(diffX) <
            swipeThreshold
        ) {

            return;

        }

        if (
            Math.abs(diffX) <=
            Math.abs(diffY)
        ) {

            return;

        }


        /*
         * راست → چپ
         *
         * diffX منفی است.
         *
         * یعنی مانیتور بعدی.
         */

        if (diffX < 0) {

            nextMonitor();

        }


        /*
         * چپ → راست
         *
         * diffX مثبت است.
         *
         * یعنی مانیتور قبلی.
         */

        else {

            previousMonitor();

        }

    }
);


/* ========================================================= */
/* شروع Mouse Drag                                          */
/* ========================================================= */

monitorViewer.addEventListener(
    'mousedown',
    function(e) {

        /*
         * فقط Left Click
         */

        if (e.button !== 0) {

            return;

        }

        if (!monitorViewer.classList.contains('active')) {

            return;

        }

        startX = e.clientX;

        startY = e.clientY;

        currentX = startX;

        currentY = startY;

        isDragging = true;

        hasMoved = false;

        monitorImage.classList.add('dragging');

    }
);


/* ========================================================= */
/* حرکت Mouse                                               */
/* ========================================================= */

window.addEventListener(
    'mousemove',
    function(e) {

        if (!isDragging) {

            return;

        }

        currentX = e.clientX;

        currentY = e.clientY;

        const diffX =
            currentX - startX;

        const diffY =
            currentY - startY;


        if (
            Math.abs(diffX) >
            Math.abs(diffY)
        ) {

            if (
                Math.abs(diffX) >
                10
            ) {

                hasMoved = true;

            }

        }

    }
);


/* ========================================================= */
/* پایان Mouse Drag                                          */
/* ========================================================= */

window.addEventListener(
    'mouseup',
    function() {

        if (!isDragging) {

            return;

        }

        isDragging = false;

        monitorImage.classList.remove('dragging');


        const diffX =
            currentX - startX;

        const diffY =
            currentY - startY;


        /*
         * اگر حرکت کافی نبوده،
         * هیچ کاری نکن.
         */

        if (
            Math.abs(diffX) <
            swipeThreshold
        ) {

            return;

        }


        /*
         * اگر حرکت عمودی بیشتر بوده،
         * Drag افقی محسوب نمی‌شود.
         */

        if (
            Math.abs(diffX) <=
            Math.abs(diffY)
        ) {

            return;

        }


        /*
         * Drag راست به چپ
         * = مانیتور بعدی
         */

        if (diffX < 0) {

            nextMonitor();

        }


        /*
         * Drag چپ به راست
         * = مانیتور قبلی
         */

        else {

            previousMonitor();

        }

    }
);


/* ========================================================= */
/* جلوگیری از Drag شدن خود Image توسط مرورگر                 */
/* ========================================================= */

monitorImage.addEventListener(
    'dragstart',
    function(e) {

        e.preventDefault();

    }
);


/* ========================================================= */
/* بستن با Escape                                            */
/* ========================================================= */

document.addEventListener(
    'keydown',

        if (e.key === 'Escape') {

            if (
                monitorViewer.classList.contains('active')
            ) {

                closeMonitorViewer();

            }

        }

    }
);

/* جلوگیری از Context Menu روی Monitor Viewer                */

monitorViewer.addEventListener(

        e.preventDefault();

    }
);

/* ========================================================= */
/* Scene Change                                              */
/* ========================================================= */

viewer.on(
    "scenechange",
    function(sceneId) {

        setTimeout(
            function() {

                const box =
                    document.querySelector(
                        ".pnlm-load-box"
                    );

                const p =
                    box
                        ? box.querySelector("p:first-child")
                        : null;


                if (box) {

                    box.classList.add(
                        "loading-text"
                    );

                }


                if (
                    p &&
                    sceneTexts[sceneId]
                ) {

                    p.textContent =
                        sceneTexts[sceneId];

                }

            },
            10
        );

    }
);


/* ========================================================= */
/* Loading Button Watcher                                    */
/* ========================================================= */

const loadButtonWatcher =
    setInterval(
        function() {

            const btn =
                document.querySelector(
                    ".pnlm-load-button"
                );


            if (btn) {

                btn.addEventListener(
                    "click",
                    function() {

                        const waitForBox =
                            setInterval(
                                function() {

                                    const box =
                                        document.querySelector(
                                            ".pnlm-load-box"
                                        );

                                    const p =
                                        box
                                            ? box.querySelector(
                                                "p:first-child"
                                            )
                                            : null;


                                    if (
                                        box &&
                                        p
                                    ) {

                                        box.classList.add(
                                            "loading-text"
                                        );

                                        p.textContent =
                                            sceneTexts["room1"];

                                        clearInterval(
                                            waitForBox
                                        );

                                    }

                                },
                                10
                            );

                    },
                    {
                        once:true
                    }
                );

                clearInterval(
                    loadButtonWatcher
                );

            }

        },
        10
    );


/* ========================================================= */
/* پایان Load                                                */
/* ========================================================= */

viewer.on(
    "load",
    function() {

        setTimeout(
            function() {

                const box =
                    document.querySelector(
                        ".pnlm-load-box"
                    );

                if (box) {

                    box.classList.remove(
                        "loading-text"
                    );

                }

            },
            100
        );

    }
);
